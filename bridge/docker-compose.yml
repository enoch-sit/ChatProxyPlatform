services:
  bridge-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FLOWISE_PROXY_API_URL: ${FLOWISE_PROXY_URL:-}
    container_name: bridge-ui
    ports:
      - "3082:3082"
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      # Change this to your Flowise Proxy API URL
      # Default: empty (bridge app falls back to same-origin on remote, localhost:8000 on localhost)
      # Production: Change to your actual API URL
      - VITE_FLOWISE_PROXY_API_URL=${FLOWISE_PROXY_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3082"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bridge-network

networks:
  bridge-network:
    driver: bridge
