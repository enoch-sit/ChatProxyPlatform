name: Rollback

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to rollback"
        required: true
        type: choice
        options:
          - auth-service
          - accounting-service
          - flowise-proxy
          - bridge
      task_definition_arn:
        description: "Previous task definition ARN (leave empty to use previous revision)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "168437900315"
  ENVIRONMENT: dev

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine rollback target
        id: target
        run: |
          CLUSTER="chatproxy-${{ env.ENVIRONMENT }}-cluster"
          SVC="chatproxy-${{ env.ENVIRONMENT }}-${{ inputs.service }}"
          
          if [ -n "${{ inputs.task_definition_arn }}" ]; then
            echo "task_def=${{ inputs.task_definition_arn }}" >> "$GITHUB_OUTPUT"
          else
            # Get current task def, then find previous revision
            CURRENT=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SVC" \
              --query 'services[0].taskDefinition' \
              --output text)
            
            echo "Current task def: $CURRENT"
            
            # Extract family and revision
            FAMILY=$(echo "$CURRENT" | sed 's/:.*$//' | sed 's/.*\///')
            REVISION=$(echo "$CURRENT" | sed 's/.*://')
            PREV_REV=$((REVISION - 1))
            
            if [ "$PREV_REV" -lt 1 ]; then
              echo "::error::No previous revision to rollback to"
              exit 1
            fi
            
            PREV_ARN="${CURRENT%:*}:$PREV_REV"
            echo "Rolling back to: $PREV_ARN"
            echo "task_def=$PREV_ARN" >> "$GITHUB_OUTPUT"
          fi

      - name: Rollback ECS service
        run: |
          CLUSTER="chatproxy-${{ env.ENVIRONMENT }}-cluster"
          SVC="chatproxy-${{ env.ENVIRONMENT }}-${{ inputs.service }}"
          
          echo "Rolling back ${{ inputs.service }} to ${{ steps.target.outputs.task_def }}"
          
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SVC" \
            --task-definition "${{ steps.target.outputs.task_def }}" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for stability
        run: |
          CLUSTER="chatproxy-${{ env.ENVIRONMENT }}-cluster"
          SVC="chatproxy-${{ env.ENVIRONMENT }}-${{ inputs.service }}"
          
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SVC" \
            --region ${{ env.AWS_REGION }}
          
          echo "Rollback complete — ${{ inputs.service }} is stable"
